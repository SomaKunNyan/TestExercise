zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Storage
  templates:
    - uuid: 7b8c9d0e1f2a4b4c8d6e7f8a9b0c1d2e
      template: 'HPE MSA 2060 SNMP'
      name: 'HPE MSA 2060 SNMP'
      description: |
        ## Overview
        Template for monitoring HPE MSA 2060 storage system via SNMP v2c/v3.
        Provides basic equipment information: system info and hardware inventory.

        ## Requirements
        - SNMP v2c or v3 enabled on MSA management port (default UDP/161)
        - Configure SNMP interface on the Zabbix host
        - Set {$SNMP.COMMUNITY} macro to match MSA SNMP community string

        ## MIBs used
        - SNMPv2-MIB    (1.3.6.1.2.1.1)    - standard system info
        - ENTITY-MIB    (1.3.6.1.2.1.47)   - RFC 2737, physical inventory

        ## Notes
        CPQARRAY-MIB and CPQHLTH-MIB are HPE ProLiant server MIBs and are
        NOT supported on MSA 2060. Use SNMP traps for event alerting.
        Run the following command to inspect available OIDs on your device:
          snmpwalk -v2c -c <community> <ip> 1.3.6.1

        ## What is monitored
        - System: description, name, contact, location, uptime
        - SNMP availability
        - Controllers (ENTITY-MIB, class=module): description, firmware,
          serial number, hardware revision, model name (auto-discovered)
        - Power supplies (ENTITY-MIB, class=powerSupply): description,
          serial number, hardware revision (auto-discovered)
      groups:
        - name: Templates/Storage
      tags:
        - tag: class
          value: storage
        - tag: target
          value: hpe-msa-2060
      macros:
        - macro: '{$SNMP.COMMUNITY}'
          value: public
          description: 'SNMP v2c community string.'
        - macro: '{$MSA.UPTIME.MIN}'
          value: '600'
          description: 'Minimum expected uptime in seconds (default: 10 min).'
      items:
        - uuid: c3d4e5f6a1b24c3d9e4f5a6b7c8d9e0f
          name: 'System: Description'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.1.1.0'
          key: system.descr
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'MIB: SNMPv2-MIB::sysDescr.0.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system

        - uuid: d4e5f6a1b2c34d4eaf5f6a7b8c9d0e1f
          name: 'System: Name'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.1.5.0'
          key: system.name
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'MIB: SNMPv2-MIB::sysName.0.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system

        - uuid: e5f6a1b2c3d44e5f8a6b7c8d9e0f1a2b
          name: 'System: Contact'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.1.4.0'
          key: system.contact
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'MIB: SNMPv2-MIB::sysContact.0.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system

        - uuid: f6a1b2c3d4e54f6a9b7c8d9e0f1a2b3c
          name: 'System: Location'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.1.6.0'
          key: system.location
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'MIB: SNMPv2-MIB::sysLocation.0.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system

        - uuid: a7b8c9d0e1f24a3bbc4d5e6f7a8b9c0d
          name: 'System: Uptime'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.1.3.0'
          key: system.uptime
          delay: 5m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: uptime
          description: 'MIB: SNMPv2-MIB::sysUpTime.0. Seconds since last reinitialization.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: b8c9d0e1f2a34b4cad5e6f7a8b9c0d1e
              expression: 'last(/HPE MSA 2060 SNMP/system.uptime)<{$MSA.UPTIME.MIN}'
              name: 'System: MSA has been restarted (uptime < 10 min)'
              priority: WARNING
              description: 'Uptime is less than {$MSA.UPTIME.MIN} s. MSA may have restarted.'
              manual_close: 'YES'
              tags:
                - tag: component
                  value: system

        - uuid: c9d0e1f2a3b44c5dbe6f7a8b9c0d1e2f
          name: 'SNMP: Availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          delay: 1m
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          description: 'SNMP availability. 1=available, 0=not available, 2=unknown.'
          valuemap:
            name: 'zabbix.host.available'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: d0e1f2a3b4c54d6e8f7a8b9c0d1e2f3a
              expression: 'last(/HPE MSA 2060 SNMP/zabbix[host,snmp,available])=0'
              name: 'SNMP: No response from MSA'
              priority: AVERAGE
              description: 'SNMP unavailable. Check network access and SNMP community string.'
              tags:
                - tag: component
                  value: health

      discovery_rules:
        - uuid: e2f3a4b5c6d74e8f9a0b1c2d3e4f5a6b
          name: 'Controllers: Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#ENT_CLASS}, 1.3.6.1.2.1.47.1.1.1.1.5, {#ENT_NAME}, 1.3.6.1.2.1.47.1.1.1.1.7]'
          key: ent.controller.discovery
          delay: 1h
          description: |
            MIB: ENTITY-MIB::entPhysicalTable (RFC 2737).
            Discovers physical modules (class=9) — MSA controllers.
            {#ENT_CLASS}  - entPhysicalClass value (9 = module).
            {#ENT_NAME}   - entPhysicalName (component label).
            {#SNMPINDEX}  - row index in entPhysicalTable.
          filter:
            evaltype: AND
            conditions:
              - macro: '{#ENT_CLASS}'
                value: '^9$'
                formulaid: A
          item_prototypes:
            - uuid: f3a4b5c6d7e84f9aab0c1d2e3f4a5b6c
              name: 'Controller [{#ENT_NAME}]: Description'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.2.{#SNMPINDEX}'
              key: 'ent.controller.descr[{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              trends: '0'
              value_type: CHAR
              description: 'MIB: ENTITY-MIB::entPhysicalDescr. Textual description of the controller.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: controller

            - uuid: a4b5c6d7e8f94a0bab1c2d3e4f5a6b7c
              name: 'Controller [{#ENT_NAME}]: Firmware version'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.9.{#SNMPINDEX}'
              key: 'ent.controller.firmware[{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              trends: '0'
              value_type: CHAR
              description: 'MIB: ENTITY-MIB::entPhysicalFirmwareRev. Controller firmware revision.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: controller

            - uuid: b5c6d7e8f9a04b1cab2c3d4e5f6a7b8c
              name: 'Controller [{#ENT_NAME}]: Serial number'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.11.{#SNMPINDEX}'
              key: 'ent.controller.serial[{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              trends: '0'
              value_type: CHAR
              description: 'MIB: ENTITY-MIB::entPhysicalSerialNum. Controller serial number.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: controller

            - uuid: c6d7e8f9a0b14c2dbc3d4e5f6a7b8c9d
              name: 'Controller [{#ENT_NAME}]: Hardware revision'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.8.{#SNMPINDEX}'
              key: 'ent.controller.hwrev[{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              trends: '0'
              value_type: CHAR
              description: 'MIB: ENTITY-MIB::entPhysicalHardwareRev. Controller hardware revision.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: controller

            - uuid: d7e8f9a0b1c24d3ebd4e5f6a7b8c9d0e
              name: 'Controller [{#ENT_NAME}]: Model name'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.13.{#SNMPINDEX}'
              key: 'ent.controller.model[{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              trends: '0'
              value_type: CHAR
              description: 'MIB: ENTITY-MIB::entPhysicalModelName. Controller model name.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: controller

        - uuid: e8f9a0b1c2d34e4fbe5f6a7b8c9d0e1f
          name: 'Power Supplies: Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#ENT_CLASS}, 1.3.6.1.2.1.47.1.1.1.1.5, {#ENT_NAME}, 1.3.6.1.2.1.47.1.1.1.1.7]'
          key: ent.psu.discovery
          delay: 1h
          description: |
            MIB: ENTITY-MIB::entPhysicalTable (RFC 2737).
            Discovers power supply units (class=6).
            {#ENT_CLASS}  - entPhysicalClass value (6 = powerSupply).
            {#ENT_NAME}   - entPhysicalName (component label).
            {#SNMPINDEX}  - row index in entPhysicalTable.
          filter:
            evaltype: AND
            conditions:
              - macro: '{#ENT_CLASS}'
                value: '^6$'
                formulaid: A
          item_prototypes:
            - uuid: f9a0b1c2d3e44f5fbf6a7b8c9d0e1f2a
              name: 'PSU [{#ENT_NAME}]: Description'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.2.{#SNMPINDEX}'
              key: 'ent.psu.descr[{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              trends: '0'
              value_type: CHAR
              description: 'MIB: ENTITY-MIB::entPhysicalDescr. Textual description of the PSU.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: power-supply

            - uuid: a0b1c2d3e4f54a6f8f7a8b9c0d1e2f3a
              name: 'PSU [{#ENT_NAME}]: Serial number'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.11.{#SNMPINDEX}'
              key: 'ent.psu.serial[{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              trends: '0'
              value_type: CHAR
              description: 'MIB: ENTITY-MIB::entPhysicalSerialNum. PSU serial number.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: power-supply

            - uuid: b1c2d3e4f5a64b7f9f8a9b0c1d2e3f4a
              name: 'PSU [{#ENT_NAME}]: Hardware revision'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.8.{#SNMPINDEX}'
              key: 'ent.psu.hwrev[{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              trends: '0'
              value_type: CHAR
              description: 'MIB: ENTITY-MIB::entPhysicalHardwareRev. PSU hardware revision.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: power-supply

      valuemaps:
        - uuid: a5b6c7d8e9f04abcbc1d2e3f4a5b6c7d
          name: 'zabbix.host.available'
          mappings:
            - value: '0'
              newvalue: Not available
            - value: '1'
              newvalue: Available
            - value: '2'
              newvalue: Unknown
